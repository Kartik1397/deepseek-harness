# The dsh-headless bundle patch: one-shot task mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`dsh --profile headless "<task>"`), the `--session-id` and `--json` options,
# and this app's --help, then the direct driver creates a fresh Agent, or adopts
# the exact Session the flag names, through the core registry and prints its
# durable result.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    # Keep the same temporary process-wide PTC mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json
        # A fresh run asks Jev (TYPESAFE_BASE_URL) once whether the task needs
        # each group and hides the groups rated unlikely before the first
        # request; an unset endpoint or any failure keeps every tool.
        toolSelection:
          enabled: true
          groups:
            - name: delegation
              question: >-
                Does completing this task require delegating work to other AI agents: spawning subagents,
                running several agents in parallel, messaging or interrupting running agents, or running a
                multi-agent workflow script? Ordinary single-agent coding, shell, and file work does not count.
              tools: [subagent, subagent_fork, workflow, list_agents, send_message, interrupt_agent]
            - name: goal
              question: >-
                Does the user ask to create, track, or resume a persistent goal that the agent keeps pursuing
                across several rounds?
              tools: [create_goal, get_goal, update_goal]
            - name: todo
              question: Does the user explicitly ask for a todo list, checklist, or tracked step-by-step progress?
              tools: [todo_write]
            - name: web
              question: >-
                Does completing this task require fetching a web page or other content from an internet
                HTTP(S) URL, rather than local files, commands, or a local server?
              tools: [web_fetch]
            - name: image
              question: >-
                Does completing this task require looking at an image file such as a screenshot, photo, or
                diagram, rather than only text files?
              tools: [read_image]
        # A fresh run in a workspace of at most maxListedFiles files asks Jev
        # once which files the task needs, reads those rated likely through
        # the read tool, and sends the listing and contents before the first
        # request; an unset endpoint or any failure sends nothing.
        filePreload:
          enabled: true
          skipDirectories: [node_modules, __pycache__, venv, dist, build, target, coverage]

- id: hmr
  disabled: true

# One-shot jobs use launch-time credentials instead of the interactive store.
- id: credentials
  disabled: true

- id: authorization
  disabled: true

- id: deepseek-account
  disabled: true
